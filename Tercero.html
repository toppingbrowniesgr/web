<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="stelys3.css">
    <link rel="icon" href="imagen/hola.png" type="image/png">
    <title>Ordenar pedido</title>
</head>
<body>
    <section id="contact" class="contact">
        <h2>Hacer pedido</h2>
        <p>¿Tienes preguntas o quieres hacer un pedido especial? Contáctanos.</p>
        <form id="order-form">
            <div>
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre"  placeholder="Tu nombre" required>
            </div>
            <div>
                <label for="correo">Correo</label>
                <input type="email" id="correo" name="correo" placeholder="ejemplo@gmail.com" required>
            </div>
            <div>
                <label for="mensaje">Mensaje</label>
                <textarea id="mensaje" name="mensaje" placeholder="Tu mensaje..." required></textarea>
            </div>
            <button type="submit">Enviar pedido</button>
        
        </form>
        
    </section>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const cart = JSON.parse(localStorage.getItem("cart") || "[]");

            document.getElementById("order-form").addEventListener("submit", function (event) {
                event.preventDefault();

                const name = document.getElementById("nombre").value.trim(); // Cambia 'name' por 'nombre'
                const email = document.getElementById("correo").value.trim(); // Cambia 'email' por 'correo'
                const message = document.getElementById("mensaje").value.trim(); // Cambia 'message' por 'mensaje'


                if (cart.length === 0) {
                    alert("El carrito está vacío.");
                    return;
                }

                let orderText = "📌 *Pedido realizado:*\n\n";
                let total = 0;

                cart.forEach(item => {
                    orderText += `- ${item.name} (x${item.quantity}) = RD $${(item.price * item.quantity).toFixed(2)}\n`;
                    total += item.price * item.quantity;
                });

                orderText += `\n💰 *Total a pagar: RD $${total.toFixed(2)}*`;
                orderText += `\n\n👤 Nombre: ${name}\n📧 Correo: ${email}\n📩 Mensaje: ${message}`;

                const whatsappNumber = "8292745882"; // Cambia por tu número
                const whatsappURL = `https://api.whatsapp.com/send?phone=${whatsappNumber}&text=${encodeURIComponent(orderText)}`;

                window.open(whatsappURL, "_blank");
                localStorage.removeItem("cart");
                event.target.reset();
            });
        });
    </script>
</body>
</html>
